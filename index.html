<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>❤️ 元旦礼物给你</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: radial-gradient(circle, #ffccdd, #ffebf2, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            color: #c21807;
            padding-top: 30px;
            overflow-x: hidden;
        }
        .container {
            max-width: 90%;
            width: 600px;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 2.4em;
            margin: 0 0 20px;
            color: #d42300;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .message {
            font-size: 1.2em;
            line-height: 1.7;
            margin-bottom: 25px;
            color: #5a1807;
        }

        /* 轮播图 */
        .slideshow {
            position: relative;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        }
        .slide {
            display: none;
        }
        .slide img {
            width: 100%;
            display: block;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            padding: 10px;
            font-size: 0.95em;
            text-align: center;
        }

        /* 小圆点指示器 */
        .dots {
            text-align: center;
            margin-top: 15px;
        }
        .dot {
            height: 10px;
            width: 10px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active, .dot:hover {
            background-color: #e63946;
        }

        .signature {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.1em;
            color: #e63946;
        }

        /* 画布：雪花 & 星星 */
        canvas#snow,
        canvas#falling-stars {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* 动态爱心样式（由 JS 控制位置和动画） */
        .falling-heart {
            position: fixed;
            top: -30px;
            font-size: 2.2em;
            color: #e63946;
            opacity: 0.9;
            z-index: -1;
            pointer-events: none;
            animation: fallHeart linear forwards;
            text-shadow: 0 0 4px rgba(230, 57, 70, 0.4);
        }

        @keyframes fallHeart {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 2em; }
            .dot { height: 8px; width: 8px; }
        }
    </style>
</head>
<body>

    <!-- 主内容 -->
    <div class="container">
        <h1>亲爱的 文文，元旦快乐！🎉</h1>
        
        <p class="message">
            在你在一起，真好。<br>
            元旦将至，我把我们的6个瞬间装进这个小网页，<br>
            愿2026年，继续与你共度晨昏，细水长流。
        </p>

        <div class="slideshow">
            <div class="slide"><img src="photo1.jpg" alt=""><div class="caption">我们一起比一个大大的爱心</div></div>
            <div class="slide"><img src="photo2.jpg" alt=""><div class="caption">笑的真可爱，很喜欢很喜欢</div></div>
            <div class="slide"><img src="photo3.jpg" alt=""><div class="caption">第一次一起做飞机，开心耶</div></div>
            <div class="slide"><img src="photo5.jpg" alt=""><div class="caption">给宝宝过生日，表白宝宝</div></div>
            <div class="slide"><img src="photo6.jpg" alt=""><div class="caption">跨年夜，一起看电影</div></div>
            <div class="slide"><img src="photo7.jpg" alt=""><div class="caption">一起去海边，喜欢你的眼睛</div></div>
        </div>

        <div class="dots">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
            <span class="dot" onclick="currentSlide(6)"></span>
            <span class="dot" onclick="currentSlide(7)"></span>
        </div>

        <p class="signature">—— 永远爱你的 磊磊</p>
    </div>

    <!-- 飘雪 -->
    <canvas id="snow"></canvas>

    <!-- 下落星星 -->
    <canvas id="falling-stars"></canvas>

    <!-- =============== 核心功能脚本 =============== -->

    <!-- 飘雪动画 -->
    <script>
        const snowCanvas = document.getElementById('snow');
        const snowCtx = snowCanvas.getContext('2d');
        snowCanvas.width = window.innerWidth;
        snowCanvas.height = window.innerHeight;

        const flakes = [];
        const flakeCount = 130;

        class Flake {
            constructor() {
                this.x = Math.random() * snowCanvas.width;
                this.y = Math.random() * -snowCanvas.height;
                this.size = Math.random() * 4 + 1;
                this.speed = Math.random() * 2 + 0.5;
                this.wind = (Math.random() - 0.5) * 0.8;
            }
            update() {
                this.y += this.speed;
                this.x += this.wind;
                if (this.y > snowCanvas.height || this.x < -10 || this.x > snowCanvas.width + 10) {
                    this.y = -10;
                    this.x = Math.random() * snowCanvas.width;
                }
            }
            draw() {
                snowCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                snowCtx.beginPath();
                snowCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                snowCtx.fill();
            }
        }

        for (let i = 0; i < flakeCount; i++) {
            flakes.push(new Flake());
        }

        function animateSnow() {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            flakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            requestAnimationFrame(animateSnow);
        }
        animateSnow();

        window.addEventListener('resize', () => {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        });
    </script>

    <!-- 持续下落的星星 -->
    <script>
        const starCanvas = document.getElementById('falling-stars');
        const starCtx = starCanvas.getContext('2d');
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;

        const stars = [];
        const starCount = 11; // 设置固定的星星数量

        class FallingStar {
            constructor() {
                this.reset();
                this.size = Math.random() * 2 + 0.8;
                this.speed = Math.random() * 1.5 + 0.3;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.color = ['#FFD700', '#FFFFFF', '#FFFACD'][Math.floor(Math.random() * 3)];
            }

            reset() {
                this.x = Math.random() * starCanvas.width;
                this.y = Math.random() * -starCanvas.height;
            }

            update() {
                this.y += this.speed;
                if (this.y > starCanvas.height) {
                    this.reset();
                }
            }

            draw() {
                starCtx.fillStyle = this.color;
                starCtx.globalAlpha = this.opacity;
                starCtx.beginPath();
                starCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                starCtx.fill();
                starCtx.globalAlpha = 1;
            }
        }

        function createStars(count) {
            for (let i = 0; i < count; i++) {
                stars.push(new FallingStar());
            }
        }

        function animateStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        createStars(starCount); // 创建固定数量的星星
        animateStars();

        window.addEventListener('resize', () => {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
        });
    </script>

    <!-- 源源不断飘落的爱心 ❤️ -->
    <script>
        const HEART_CONFIG = {
            minInterval: 100,    // 最短生成间隔（ms）
            maxInterval: 200,   // 最长生成间隔
            minDuration: 8,      // 最短下落时间（秒）
            maxDuration: 14,     // 最长下落时间
            maxHearts: 33        // 最大同时存在数量
        };

        let activeHearts = 0;

        function createHeart() {
            if (activeHearts >= HEART_CONFIG.maxHearts) return;

            const heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.textContent = '❤️';

            // 随机水平位置
            heart.style.left = `${Math.random() * 100}%`;

            // 随机动画时长
            const duration = HEART_CONFIG.minDuration + 
                            Math.random() * (HEART_CONFIG.maxDuration - HEART_CONFIG.minDuration);
            heart.style.animationDuration = `${duration}s`;

            document.body.appendChild(heart);
            activeHearts++;

            // 动画结束后自动移除
            setTimeout(() => {
                if (heart.parentNode) {
                    heart.parentNode.removeChild(heart);
                    activeHearts--;
                }
            }, duration * 1000);
        }

        function startHeartRain() {
            createHeart(); // 立即创建第一颗
            setInterval(() => {
                if (activeHearts < HEART_CONFIG.maxHearts) {
                    createHeart();
                }
            }, HEART_CONFIG.minInterval + Math.random() * (HEART_CONFIG.maxInterval - HEART_CONFIG.minInterval));
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startHeartRain);
        } else {
            startHeartRain();
        }
    </script>

    <!-- 轮播控制 -->
    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            const slides = document.getElementsByClassName("slide");
            const dots = document.getElementsByClassName("dot");
            if (n > slides.length) slideIndex = 1;
            if (n < 1) slideIndex = slides.length;
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            slides[slideIndex - 1].style.display = "block";
            if (slideIndex - 1 < dots.length) {
                dots[slideIndex - 1].className += " active";
            }
        }

        setInterval(() => {
            plusSlides(1);
        }, 5000);
    </script>
</body>
</html>
